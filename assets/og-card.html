<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #faf6ef;
    color: #221c14;
    font-family: "Instrument Sans", sans-serif;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px; box-sizing: border-box;
    position: relative;
  }
  .kicker {
    font-size: 19px; font-weight: 600; letter-spacing: .15em;
    text-transform: uppercase; color: #b45309; margin: 0 0 24px;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: 100px; line-height: 1.02; letter-spacing: -.015em;
    margin: 0 0 30px;
  }
  h1 .hl { color: #b45309; }
  p.lede {
    font-size: 27px; line-height: 1.5; color: #554b3a;
    margin: 0; max-width: 880px;
  }
  .foot {
    position: absolute; left: 96px; bottom: 56px;
    font-size: 17px; letter-spacing: .12em; text-transform: uppercase;
    color: #8f8471;
  }
  .mark {
    position: absolute; right: 96px; top: 60px;
    width: 40px; height: 40px;
  }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <rect x="29" y="8" width="6" height="48" rx="1" fill="#8f8471"/>
    <path d="M14 20 L50 20 M18 32 L46 32 M22 44 L42 44" stroke="#8f8471" stroke-width="4" stroke-linecap="round"/>
    <circle cx="32" cy="8" r="5" fill="#b45309"/>
  </svg>
  <p class="kicker">Tower climber → foreman</p>
  <h1>Hey, I'm <span class="hl">Adam</span>.</h1>
  <p class="lede">Cell sites from bare dirt to on-air — steel, conduit, shelters, radios, RF, fiber.</p>
  <p class="foot">Class A CDL &nbsp;·&nbsp; New England</p>
</body>
</html>
