<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#0b0a08;
    font-family:'IBM Plex Mono',monospace;
    color:#f2e9d6;
    position:relative;
  }
  /* camo breakup — soft asymmetric fields, echoing the page's pigment fluid */
  .camo{position:absolute;inset:-10%;filter:blur(38px);opacity:.85}
  .camo i{position:absolute;border-radius:50%;display:block}
  .c1{width:760px;height:620px;left:-140px;top:-180px;background:radial-gradient(circle,rgba(58,74,34,.85),rgba(58,74,34,0) 70%)}
  .c2{width:640px;height:560px;right:-120px;top:-90px;background:radial-gradient(circle,rgba(122,74,28,.55),rgba(122,74,28,0) 70%)}
  .c3{width:820px;height:520px;left:180px;bottom:-260px;background:radial-gradient(circle,rgba(36,51,24,.9),rgba(36,51,24,0) 70%)}
  .c4{width:420px;height:380px;right:60px;bottom:-140px;background:radial-gradient(circle,rgba(88,60,36,.5),rgba(88,60,36,0) 70%)}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 46% 42%,rgba(0,0,0,.18),rgba(6,5,3,.62) 76%,rgba(4,3,2,.8))}
  .grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
  .frame{position:relative;height:100%;padding:66px 74px 60px;display:flex;flex-direction:column;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:15px}
  .mark svg{display:block;width:44px;height:44px;border-radius:9px}
  .handle{font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:#b7a98c}
  h1{font-family:'Archivo',sans-serif;font-weight:900;font-stretch:106%;
     font-variation-settings:"wdth" 106,"wght" 900;
     font-size:96px;line-height:.88;letter-spacing:-.035em;text-transform:uppercase}
  h1 span{display:block}
  .rule{width:88px;height:5px;background:#e8490f;margin:26px 0 22px}
  .sub{font-size:17px;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:#b7a98c}
  .foot{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#b7a98c}
  .foot b{color:#f2e9d6;font-weight:500}
</style>
</head>
<body>
  <div class="camo"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="frame">
    <div class="mark">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="13" fill="#0b0a08"/>
        <g fill="none" stroke="#f2e9d6" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19.5 15 10.5 49"/><path d="M19.5 15 28.5 49"/>
          <path d="M40 49V15"/><path d="M55 49V15"/><path d="M40 15l15 34"/>
        </g>
        <path d="M13.9 36.5h11.2" fill="none" stroke="#e8490f" stroke-width="5.8" stroke-linecap="round"/>
      </svg>
      <span class="handle">foshowithit</span>
    </div>

    <div>
      <h1><span>Adam</span><span>Normandin</span></h1>
      <div class="rule"></div>
      <p class="sub">Prompts · Certs · Links</p>
    </div>

    <div class="foot">
      <span><b>adamn.info</b></span>
      <span>wireless tower · defi · ai</span>
    </div>
  </div>
</body>
</html>
