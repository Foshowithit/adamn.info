<style>

"use strict";
const LABS=[
 {n:"Sacred Heart",u:"https://foshowithit.github.io/sacred-heart/"},
 {n:"Village",u:"https://foshowithit.github.io/village-above-the-clouds/"},
 {n:"Village OMP",u:"https://foshowithit.github.io/village-above-the-clouds-omp/"},
 {n:"Slewing Bearing",u:"https://foshowithit.github.io/slewing-bearing/"},
 {n:"Mont St Michel",u:"https://foshowithit.github.io/mont-saint-michel/"},
 {n:"Cathedral City",u:"https://foshowithit.github.io/cathedral-city/"},
 {n:"The Cathedral",u:"https://foshowithit.github.io/the-cathedral/"},
 {n:"Avignon",u:"https://foshowithit.github.io/avignon-throne-of-stone/"},
 {n:"Aether OS",u:"https://foshowithit.github.io/aether-os/"},
 {n:"Hog Crankers",u:"https://foshowithit.github.io/hog-crankers/"},
 {n:"Industria",u:"https://foshowithit.github.io/industria/"},
 {n:"R9700 Build",u:"https://foshowithit.github.io/r9700-build/"},
];
 const lablist=document.getElementById('lablist'),labview=document.getElementById('labview'),
       labdesc=document.getElementById('labdesc'),labopen=document.getElementById('labopen');
 let labInit=false;
 function pickLab(i){
   const l=LABS[i];
   if(labview.getAttribute('src')!==l.u) labview.src=l.u;
   labdesc.textContent=l.n+' · '+l.u; labopen.href=l.u;
   [...lablist.children].forEach((b,j)=>b.classList.toggle('on',j===i));
   labInit=true;
 }
 lablist.innerHTML=LABS.map((l,i)=>'<button data-i="'+i+'">'+l.n+'</button>').join('');
 lablist.querySelectorAll('button').forEach(b=>b.onclick=()=>pickLab(+b.dataset.i));
 function route(){
   const h=location.hash;
   const home=h!== '#certs' && h!=='#lab';
   document.getElementById('v-home').classList.toggle('active',home);
   document.getElementById('v-certs').classList.toggle('active',h==='#certs');
   document.getElementById('v-lab').classList.toggle('active',h==='#lab');
   if(h==='#lab'&&!labInit) pickLab(0);
   scrollTo(0,0);
 }
 addEventListener('hashchange',route); route();
 document.querySelectorAll('[data-split]').forEach(el=>{
   const txt=el.textContent; el.textContent='';
   [...txt].forEach((c,i)=>{
     const s=document.createElement('span'); s.className='ch'; s.style.setProperty('--i',i);
     s.innerHTML=c===' '?'&nbsp;':c; el.appendChild(s);
   });
 });
 // letters swell near pointer — hover-capable + motion-ok only, rAF-throttled
 const finePointer=matchMedia('(hover:hover)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
 let px=0,py=0,ptick=false;
 if(finePointer) addEventListener('pointermove',e=>{
   px=e.clientX; py=e.clientY;
   if(ptick) return; ptick=true;
   requestAnimationFrame(()=>{
     ptick=false;
     document.querySelectorAll('.tlink .t').forEach(t=>{
       const r=t.getBoundingClientRect();
       const dx=(px-(r.left+r.width/2))/Math.max(1,r.width), dy=(py-(r.top+r.height/2))/Math.max(1,r.height);
       const d=Math.min(1,Math.hypot(dx,dy));
       const k=1-d;
       t.style.fontVariationSettings=`\"wdth\" ${Math.round(112+k*13)},\"wght\" ${Math.round(850+k*150)}`;
     });
   });
 }, {passive:true});
</script>
<script>
"use strict";
/* Living Camo Fluid — feedback-advected pigment field (your build, embedded as page bg) */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, depth:false, stencil:false, alpha:false});
if(!gl){ document.body.innerHTML='<p style="color:#e8e0cc">WebGL2 needed</p>'; throw new Error('no webgl2'); }
window.__VILLAGE_ERR = null;
const VERT = `#version 300 es
layout(location=0) in vec2 p; out vec2 vUv;
void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;
const NOISE = `
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
float fbm(vec2 p){ float v=0., a=.5; mat2 r=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=r*p; a*=.5; } return v; }
vec2 curl(vec2 p){ float e=.1;
  float ny1=vnoise(p+vec2(0,e)), ny0=vnoise(p-vec2(0,e));
  float nx1=vnoise(p+vec2(e,0)), nx0=vnoise(p-vec2(e,0));
  return normalize(vec2((ny1-ny0), -(nx1-nx0))+.0001); }
vec2 voro(vec2 p){ vec2 ip=floor(p), fp=fract(p); float f1=8., f2=8.;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 g=vec2(float(i),float(j));
    vec2 o=vec2(hash(ip+g), hash(ip+g+19.19));
    vec2 r=g+o-fp; float d=dot(r,r);
    if(d<f1){ f2=f1; f1=d; } else if(d<f2){ f2=d; } }
  return sqrt(vec2(f1,f2)); }
 vec3 pal(float h){
   vec3 c1=vec3(.055,.065,.040);
   vec3 c2=vec3(.105,.185,.085);
   vec3 c3=vec3(.385,.425,.205);
   vec3 c4=vec3(.560,.385,.205);
   vec3 c5=vec3(.880,.820,.680);
   vec3 col=mix(c1,c2,smoothstep(.02,.24,h));
   col=mix(col,c3,smoothstep(.24,.46,h));
   col=mix(col,c4,smoothstep(.46,.66,h));
   col=mix(col,c5,smoothstep(.72,.92,h));
   return col; }
`;
const SIM_FRAG = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 O;
uniform sampler2D uPrev;
uniform vec2  uRes;
uniform float uAspect;
uniform float uTime;
uniform float uSlow;
uniform vec2  uPtr;
uniform vec2  uPtrVel;
uniform float uPtrDown;
uniform vec2  uPulsePos;
uniform float uPulseAge;
uniform vec2  uGhost;
uniform float uInit;
${NOISE}
void main(){
  vec2 uv = vUv;
  float t = uSlow;
  vec2 w1 = curl(uv*vec2(uAspect,1.)*3.0 + vec2(t*.55, -t*.38));
  vec2 w2 = curl(uv*vec2(uAspect,1.)*7.3 - vec2(t*.31, t*.47) + 4.7);
  vec2 w3 = curl(uv*vec2(uAspect,1.)*15.0 + vec2(-t*.9, t*.7) + 9.1);
  vec2 flow = w1*.34 + w2*.13 + w3*.045;
  vec2 ad = uv - uPtr; ad.x *= uAspect;
  float r = length(ad);
  vec2 dir = r > 1e-4 ? vec2(ad.x/(uAspect*r), ad.y/max(r,1e-4)) : vec2(0.);
  float push = exp(-r*r*70.0);
  vec2 pvel = uPtrVel * push * (0.55 + 0.65*uPtrDown);
  vec2 gd = uv - uPulsePos; gd.x *= uAspect;
  float gr = length(gd);
  vec2 gdir = gr > 1e-4 ? vec2(gd.x/(uAspect*gr), gd.y/max(gr,1e-4)) : vec2(0.);
  float waveR = uPulseAge*0.22;
  float ring = exp(-pow((gr-waveR)*13.0,2.0)) * exp(-uPulseAge*1.1) * step(0.,uPulseAge) * step(uPulseAge,6.);
  vec2 wave = (gdir*0.8 + vec2(-gdir.y,gdir.x)*0.45) * ring;
  vec2 hd = uv - uGhost; hd.x *= uAspect;
  float hr = length(hd);
  vec2 hdir = hr > 1e-4 ? vec2(hd.x/(uAspect*hr), hd.y/max(hr,1e-4)) : vec2(0.);
  vec2 ghost = hdir * exp(-hr*hr*22.0) * 0.25;
  float dt = 1.0/60.0;
  vec2 vel = flow*0.16 + pvel*0.5 + wave*0.35 + ghost*0.3;
  vec2 suv = uv - vel*dt*8.0;
  suv += 0.00045*vec2(sin(uTime*.06+uv.y*7.), cos(uTime*.05+uv.x*6.));
  suv = clamp(suv, vec2(.001), vec2(.999));
  vec4 prev = texture(uPrev, suv);
  vec3 pc = prev.rgb;
  vec2 fuv = suv*vec2(uAspect,1.);
  vec2 auv = uv*vec2(uAspect,1.);
  float warp = fbm(auv*4.4 + (pc.rg-.5)*.9 + vec2(t*.12,-t*.10));
  float detail = fbm(auv*8.2 + warp*1.6 + (pc.gb-.5)*.5 + vec2(-t*.07,t*.09));
  float h = clamp((warp-.5)*1.25 + (detail-.5)*1.0 + .50, 0., 1.);
  vec2 cellUv = (auv*5.5 + (pc.gb-.5)*.7 + vec2(t*.05,-t*.04));
  vec2 v = voro(cellUv);
  float edge = v.y - v.x;
  float cellShade = smoothstep(.02,.28,edge);
  float cellId = hash(floor(cellUv)+floor(warp*3.));
  float m = abs(fract((warp*1.4+detail*.9))-.5)*2.;
  float vein = smoothstep(.05,.004,m)*step(.55,fract(warp*7.3+detail*3.1));
  float vein2 = smoothstep(.22,.02,m)*.4;
  vec3 target = pal(h);
  target *= .78 + .40*cellShade;
  target = mix(target, vec3(.72,.68,.58), vein*.28);
  target = mix(target, vec3(.435,.270,.165), vein2*.22);
  target *= 1.0 - (1.0-cellShade)*.5;
  target += (cellId-.5)*.05;
  if(uInit > .5){
    float h0 = clamp((fbm(fuv*3.1)-.5)*.95 + (fbm(fuv*6.7+3.1)-.5)*.7 + .42, 0., 1.);
    vec3 c0 = pal(h0);
    float m0 = abs(fract(fbm(fuv*4.4)*2.4)-.5)*2.;
    c0 = mix(c0, vec3(.72,.68,.58), smoothstep(.06,.01,m0)*.3);
    O = vec4(c0,1.);
    return;
  }
  float micro = (detail-.5)*.05 + (w3.x)*.012;
  vec3 col = mix(pc, target, 0.09);
  col += micro;
  col = mix(col, vec3(.80,.74,.60), push*(.10+.25*uPtrDown));
  col = (col-.5)*1.02+.5;
  O = vec4(clamp(col,0.,1.), 1.);
}`;
const SHOW_FRAG = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 O;
uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uAspect, uTime;
${NOISE}
void main(){
  vec2 uv = vUv;
  vec3 base = texture(uTex, uv).rgb;
  vec2 fuv = uv*vec2(uAspect,1.);
  float w = fbm(fuv*6.0 + vec2(uTime*.015,-uTime*.012) + base.gb*2.0);
  float m = abs(fract(w*1.8)-.5)*2.;
  float vein = smoothstep(.05,.005,m)*step(.6,fract(w*9.1));
  vec3 col = mix(base, vec3(.72,.68,.58), vein*.14);
  float f = fbm(fuv*22.0 + vec2(-uTime*.02,uTime*.017));
  col += (f-.5)*.045;
  col += (hash(uv*uRes+fract(uTime)*7.)-.5)*.028;
   vec2 q = uv-.5; q.x*=uAspect;
   col *= 1.0 - dot(q,q)*.38;
  col = pow(max(col,0.), vec3(.96));
  O = vec4(col,1.);
}`;
function prog(vs, fs){
  const v = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(v,vs); gl.compileShader(v);
  if(!gl.getShaderParameter(v,gl.COMPILE_STATUS)) throw new Error('vs: '+gl.getShaderInfoLog(v));
  const f = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(f,fs); gl.compileShader(f);
  if(!gl.getShaderParameter(f,gl.COMPILE_STATUS)) throw new Error('fs: '+gl.getShaderInfoLog(f));
  const p = gl.createProgram(); gl.attachShader(p,v); gl.attachShader(p,f); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error('link: '+gl.getProgramInfoLog(p));
  return p;
}
const simP = prog(VERT, SIM_FRAG), showP = prog(VERT, SHOW_FRAG);
const U = (p,n)=>gl.getUniformLocation(p,n);
const simU = {prev:U(simP,'uPrev'),res:U(simP,'uRes'),aspect:U(simP,'uAspect'),time:U(simP,'uTime'),
  slow:U(simP,'uSlow'),ptr:U(simP,'uPtr'),ptrVel:U(simP,'uPtrVel'),ptrDown:U(simP,'uPtrDown'),
  pulsePos:U(simP,'uPulsePos'),pulseAge:U(simP,'uPulseAge'),ghost:U(simP,'uGhost'),init:U(simP,'uInit')};
const showU = {tex:U(showP,'uTex'),res:U(showP,'uRes'),aspect:U(showP,'uAspect'),time:U(showP,'uTime')};
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
let simW=0, simH=0, fbos=[], texs=[];
function makeTargets(w,h){
  for(const f of fbos) gl.deleteFramebuffer(f);
  for(const t of texs) gl.deleteTexture(t);
  fbos=[]; texs=[];
  simW=w; simH=h;
  for(let i=0;i<2;i++){
    const t=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    const f=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
    fbos.push(f); texs.push(t);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function sizeCanvas(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  canvas.width = Math.round(innerWidth*dpr); canvas.height = Math.round(innerHeight*dpr);
}
function simScale(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  const maxSim = 640;
  const aw = innerWidth*dpr, ah = innerHeight*dpr;
  const s = Math.min(1, maxSim/Math.max(aw,ah));
  return [Math.max(2,Math.round(aw*s)), Math.max(2,Math.round(ah*s))];
}
let initFrames=3;
function resize(){
  sizeCanvas();
  gl.viewport(0,0,canvas.width,canvas.height);
  const [w,h]=simScale(); makeTargets(w,h);
  initFrames = 3;
}
addEventListener('resize', resize);
let ptr={x:-2,y:-2}, ptrVel={x:0,y:0}, lastPtr={x:-2,y:-2}, lastT=performance.now();
let down=false, pulsePos={x:.5,y:.5}, pulseT=-100, ghost={x:.3,y:.6};
function ev(e){
  const r=canvas.getBoundingClientRect();
  const cx=(e.clientX-r.left)/r.width, cy=1-(e.clientY-r.top)/r.height;
  const now=performance.now(), dt=Math.max(1,now-lastT)/1000;
  const vx=(cx-lastPtr.x)/dt, vy=(cy-lastPtr.y)/dt;
  const cl=v=>Math.max(-3,Math.min(3,v));
  ptrVel.x = ptrVel.x*.82 + cl(vx)*.18;
  ptrVel.y = ptrVel.y*.82 + cl(vy)*.18;
  lastPtr={x:cx,y:cy}; lastT=now; ptr={x:cx,y:cy};
}
addEventListener('pointermove',ev,{passive:true});
addEventListener('pointerdown',e=>{ down=true; ev(e); pulsePos={...ptr}; pulseT=tWall; },{passive:true});
addEventListener('pointerup',()=>down=false,{passive:true});
let tWall=0, tSlow=0, cur=0, frames=0;
resize();
let prevMs=performance.now();
function frame(){
  const now=performance.now();
  let dt=(now-prevMs)/1000; prevMs=now;
  dt=Math.min(dt,.05);
  tWall+=dt; tSlow+=dt*.14;
  ghost.x=.5+.38*Math.sin(tWall*.021+1.7); ghost.y=.5+.34*Math.sin(tWall*.017*.9+.6);
  ptrVel.x*=.90; ptrVel.y*=.90;
  const aspect=canvas.width/Math.max(1,canvas.height);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[1-cur]);
  gl.viewport(0,0,simW,simH);
  gl.useProgram(simP);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texs[cur]);
  gl.uniform1i(simU.prev,0);
  gl.uniform2f(simU.res,simW,simH);
  gl.uniform1f(simU.aspect,aspect);
  gl.uniform1f(simU.time,tWall);
  gl.uniform1f(simU.slow,tSlow);
  gl.uniform2f(simU.ptr,ptr.x,ptr.y);
  gl.uniform2f(simU.ptrVel,ptrVel.x,ptrVel.y);
  gl.uniform1f(simU.ptrDown,down?1:0);
  gl.uniform2f(simU.pulsePos,pulsePos.x,pulsePos.y);
  gl.uniform1f(simU.pulseAge,tWall-pulseT);
  gl.uniform2f(simU.ghost,ghost.x,ghost.y);
  gl.uniform1f(simU.init,initFrames>0?1:0);
  gl.drawArrays(gl.TRIANGLES,0,3);
  cur=1-cur;
  if(initFrames>0) initFrames--;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(showP);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,texs[cur]);
  gl.uniform1i(showU.tex,0);
  gl.uniform2f(showU.res,canvas.width,canvas.height);
  gl.uniform1f(showU.aspect,aspect);
  gl.uniform1f(showU.time,tWall);
  gl.drawArrays(gl.TRIANGLES,0,3);
  frames++;
  if(frames===5) window.__VILLAGE_READY=true;
  requestAnimationFrame(frame);
}
 try{ requestAnimationFrame(frame); }
 catch(err){ window.__VILLAGE_ERR=String(err); throw err; }
 /* Mossy Oak breakup overlay: bark verticals + oak leaves + twigs + acorns */
 (function(){
 const oc=document.getElementById('oak'), ox=oc.getContext('2d');
 const R=(a,b)=>a+Math.random()*(b-a), PICK=a=>a[Math.random()*a.length|0];
 function acorn(g,x,y,s,rot,fill){
   // simple acorn: cap + nut, tiny — reads as forest floor at a glance
   g.save(); g.translate(x,y); g.rotate(rot); g.scale(s/10,s/10);
   g.fillStyle=fill;
   g.beginPath(); g.ellipse(0,2.5,3.2,4.2,0,0,7); g.fill();
   g.fillStyle='rgba(52,34,18,.9)';
   g.beginPath(); g.ellipse(0,-1.5,3.6,2.4,0,0,7); g.fill();
   g.strokeStyle='rgba(20,12,6,.6)'; g.lineWidth=1;
   g.beginPath(); g.moveTo(0,-3.5); g.lineTo(1.5,-6); g.stroke();
   g.restore();
 }
 function paintOak(){
   const dpr=Math.min(devicePixelRatio||1,1.5);
   const W=innerWidth, H=innerHeight;
   oc.width=W*dpr; oc.height=H*dpr; ox.setTransform(dpr,0,0,dpr,0,0);
   ox.clearRect(0,0,W,H);
   // Mossy Oak breakup: 3 soft trunks pinned to the edges, center stays open for type
   const spots=[R(W*0.0,W*0.14), R(W*0.86,W*1.0), R(W*0.16,W*0.3)];
   for(let i=0;i<3;i++){
     const bx=spots[i], w=R(54,110), lean=R(-70,70);
     ox.save(); ox.filter='blur(9px)'; ox.globalAlpha=.5;
     const halo=ox.createLinearGradient(bx-w,0,bx+w,0);
     halo.addColorStop(0,'rgba(10,7,4,0)'); halo.addColorStop(.5,'rgba(20,12,7,.9)'); halo.addColorStop(1,'rgba(10,7,4,0)');
     ox.fillStyle=halo;
     ox.beginPath();
     ox.moveTo(bx-w,0); ox.lineTo(bx-w+lean,H); ox.lineTo(bx+w+lean,H); ox.lineTo(bx+w,0);
     ox.closePath(); ox.fill(); ox.restore();
     ox.save(); ox.globalAlpha=.6;
     const core=ox.createLinearGradient(bx-w/2,0,bx+w/2,0);
     core.addColorStop(0,'rgba(14,9,5,0)'); core.addColorStop(.35,'rgba(43,28,16,.9)');
     core.addColorStop(.6,'rgba(88,60,36,.8)'); core.addColorStop(1,'rgba(12,8,5,0)');
     ox.fillStyle=core;
     ox.beginPath();
     ox.moveTo(bx-w/2,0); ox.lineTo(bx-w/2+lean,H); ox.lineTo(bx+w/2+lean,H); ox.lineTo(bx+w/2,0);
     ox.closePath(); ox.fill(); ox.restore();
     ox.save();
     ox.beginPath();
     ox.moveTo(bx-w/2,0); ox.lineTo(bx-w/2+lean,H); ox.lineTo(bx+w/2+lean,H); ox.lineTo(bx+w/2,0);
     ox.closePath(); ox.clip();
     for(let k=0;k<7;k++){
       const off=R(-w/2.4,w/2.4), dark=Math.random()<.65;
       ox.strokeStyle=dark?PICK(['rgba(8,5,3,.6)','rgba(20,12,7,.55)']):PICK(['rgba(150,112,70,.4)','rgba(112,80,48,.35)']);
       ox.lineWidth=R(1.5,4); ox.beginPath();
       for(let y=-10;y<=H+10;y+=30){
         const t=y/H, x=bx+off+lean*t+Math.sin(y*.02+off)*7;
         y<0?ox.moveTo(x,y):ox.lineTo(x,y);
       }
       ox.stroke();
     }
     ox.restore();
   }
   // sparse acorns on the floor band only — no floating shapes
   const tones=['rgba(96,78,48,.75)','rgba(74,64,40,.7)','rgba(58,52,32,.75)'];
   for(let k=0;k<26;k++) acorn(ox,R(0,W),R(H*.82,H+20),R(7,14),R(-.4,.4),PICK(tones));
   ox.save(); ox.globalCompositeOperation='screen';
   for(let k=0;k<34;k++){
     const x=R(0,W), y=R(0,H*.8), r=R(24,90);
     const g2=ox.createRadialGradient(x,y,0,x,y,r);
     g2.addColorStop(0,'rgba(255,220,160,'+R(.05,.13).toFixed(3)+')'); g2.addColorStop(1,'rgba(255,220,160,0)');
     ox.fillStyle=g2; ox.beginPath(); ox.arc(x,y,r,0,7); ox.fill();
   }
   ox.restore();
 }
 paintOak();
 let oakT; addEventListener('resize',()=>{ clearTimeout(oakT); oakT=setTimeout(paintOak,200); });
 })();
 window.__LINKS_READY=true;
</script>
